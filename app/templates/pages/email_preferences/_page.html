<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Email preferences{% endblock %} — T[root]H Discipleship</title>
  <style>
    body { margin:0; background:#0b0b0b; color:#f2f2f2; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    main { max-width:520px; margin:48px auto; padding:0 16px; }
    .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:32px 28px; text-align:center; }
    h1 { color:#d4af37; font-size:22px; margin:0 0 14px; }
    p { color:#e6e6e6; line-height:1.6; margin:0 0 14px; }
    .muted { color:#a3a3a3; font-size:14px; }
    button { background:#d4af37; color:#000; border:0; border-radius:6px; padding:14px 28px; min-height:48px; font-size:16px; font-weight:700; cursor:pointer; }
    button.secondary { background:transparent; color:#e8c547; border:1px solid #e8c547; }
    a { color:#e8c547; }
    .brand { color:#d4af37; font-weight:700; margin-bottom:18px; display:block; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <span class="brand">T[root]H Discipleship</span>
      {% block content %}{% endblock %}
      <p class="muted" style="margin-top:22px;">Questions? <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
    </div>
  </main>
</body>
</html>
